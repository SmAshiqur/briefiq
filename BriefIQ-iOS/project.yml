## XcodeGen project definition.
##
## Why xcodegen:
##   - .pbxproj is unreadable XML; merge conflicts in it are nightmare fuel.
##   - This file is git-friendly. Drop a Swift file in Features/, run
##     `xcodegen generate`, and the project picks it up.
##
## Install once on Mac:  brew install xcodegen
## Generate:             cd BriefIQ-iOS && xcodegen generate
## Open:                 open BriefIQ.xcodeproj

name: BriefIQ
options:
  bundleIdPrefix: com.briefiq
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    DEVELOPMENT_TEAM: ""

targets:
  BriefIQ:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Features
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleDisplayName: BriefIQ
        UILaunchScreen:
          UIColorName: BackgroundColor
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # API base URL — baked into the binary so `xcodegen generate`
        # cannot wipe it (Scheme env vars get regenerated). Override at
        # runtime via Settings → Diagnostics (writes UserDefaults).
        #
        # Replace this with your LAN IP when running on a real device or
        # when the simulator can't reach the backend at localhost.
        BriefIQAPIBaseURL: http://localhost:3000
        # Lets the iOS app talk to localhost AND arbitrary LAN IPs during
        # dev. Tighten before store submission.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.briefiq.app
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: App/BriefIQ.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        aps-environment: development

  BriefIQTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BriefIQ
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/BriefIQ.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BriefIQ

schemes:
  BriefIQ:
    build:
      targets:
        BriefIQ: all
        BriefIQTests: [test]
    test:
      targets:
        - BriefIQTests
